<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuaderno · 2º de primaria</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--card:#fff;--text:#1e2440;--muted:#6a7390;--line:#e3e7f2;--m:#5b6cff;--i:#12a594;--l:#f0900f;--r:#9b5de5;--ok:#22a45d;--bad:#e5484d;--sh:rgba(30,36,64,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#1b1f40;--text:#eef0ff;--muted:#a3abd0;--line:#2d3360;--sh:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#1b1f40;--text:#eef0ff;--muted:#a3abd0;--line:#2d3360;--sh:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Segoe UI",Arial,sans-serif;font-size:18px}
#app{max-width:560px;margin:0 auto;padding:10px 16px 110px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#ttl{flex:1;font-size:18px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card);border:0;border-radius:14px;padding:8px 13px;font:inherit;font-weight:800;color:var(--text);box-shadow:0 2px 8px var(--sh);cursor:pointer}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.w{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 2px 10px var(--sh);display:flex;flex-direction:column;justify-content:center;border:0;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.w.big{grid-column:1/3;flex-direction:row;align-items:center;gap:14px}
.w small{color:var(--muted);font-size:13px;font-weight:600}.w b{font-size:26px;font-weight:800}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 4px 10px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;position:relative;padding:0}
.ic{width:64px;height:64px;border-radius:19px;background:linear-gradient(150deg,var(--a),color-mix(in srgb,var(--a) 62%,#000));display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 4px 10px var(--sh)}
.lvb{position:absolute;top:-4px;right:calc(50% - 38px);background:var(--card);border-radius:9px;font-size:11px;padding:1px 6px;box-shadow:0 1px 4px var(--sh);font-weight:800}
.app:active .ic,.opt:active,.big:active,.key:active{transform:scale(.94)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-radius:26px;box-shadow:0 6px 24px var(--sh);display:flex;justify-content:space-around;padding:8px;z-index:4}
#dock button{background:none;border:0;font:inherit;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 7px;border-radius:16px;cursor:pointer;flex:1}
#dock button span{font-size:22px}#dock button.on{background:var(--bg);color:var(--text)}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 2px 10px var(--sh);text-align:center;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:2px 0 14px}.bar i{display:block;height:100%;background:var(--a);transition:width .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.opts.one{grid-template-columns:1fr}.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 10px;font:inherit;font-weight:800;font-size:22px;color:var(--text);cursor:pointer}
.opts.one .opt{text-align:left;font-size:18px;font-weight:600;padding:14px 16px}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.big{border:0;border-radius:16px;padding:13px 22px;font:inherit;font-weight:800;font-size:18px;background:var(--a,var(--m));color:#fff;margin:6px 4px;cursor:pointer}
.big.s{background:var(--line);color:var(--text)}.big[disabled]{opacity:.4}
.vert{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:50px;font-weight:800;line-height:1.15;min-width:130px;font-variant-numeric:tabular-nums}
.vert .r{display:flex;justify-content:space-between;width:100%}.vert .r b{color:var(--a)}
.vert hr{width:100%;border:0;border-top:4px solid var(--text);margin:6px 0}
.hor{font-size:44px;font-weight:800}.txt{font-size:21px;font-weight:700;line-height:1.4}
.box{display:inline-block;min-width:96px;min-height:64px;border:3px solid var(--a);border-radius:14px;font-size:44px;font-weight:800;padding:0 12px;margin-top:6px;line-height:58px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:8px auto 0}
.key{border:0;background:var(--card);border-radius:16px;padding:12px 0;font:inherit;font-size:26px;font-weight:800;color:var(--text);box-shadow:0 2px 6px var(--sh);cursor:pointer}.key.go{background:var(--ok);color:#fff}
.img{font-size:84px;line-height:1.1}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.slot,.ltr{min-width:48px;height:56px;padding:0 10px;border-radius:12px;font:inherit;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center}
.slot{border:2px dashed var(--line);background:transparent;color:var(--text)}.slot.f{border:2px solid var(--a);background:var(--card)}
.ltr{border:0;background:var(--a);color:#fff;cursor:pointer}.ltr[disabled]{opacity:.2}
.dot{width:130px;height:130px;border-radius:50%;margin:6px auto 12px;border:5px solid var(--line)}
.story{text-align:left;font-size:20px;line-height:1.6}.story h3{margin:0 0 8px;font-size:22px}
details{margin-top:10px;text-align:left}summary{cursor:pointer;color:var(--muted);font-size:16px;font-weight:600}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-250%);padding:12px 20px;border-radius:16px;color:#fff;font-weight:800;transition:transform .25s;max-width:92vw;text-align:center;z-index:9}
#toast.show{transform:translate(-50%,0)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;text-align:left}
.row:last-child{border:0}.row small{color:var(--muted);display:block}
.chart{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:10px}.chart div{flex:1;border-radius:6px 6px 0 0;min-height:4px}
.big-n{font-size:38px;font-weight:800}
.med{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.med div{background:var(--card);border-radius:18px;padding:12px 6px;font-size:12px;font-weight:700;box-shadow:0 2px 8px var(--sh);text-align:center}.med div span{font-size:34px;display:block}.med .off{opacity:.35;filter:grayscale(1)}
textarea,input{width:100%;font:inherit;font-size:14px;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.cal .wd{font-size:12px;color:var(--muted);font-weight:800;text-align:center}.cd{aspect-ratio:1;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:800;line-height:1.2}.cd span{font-size:12px}.cd.p{background:color-mix(in srgb,var(--m) 25%,var(--card))}.cd.g{background:var(--ok);color:#fff}.cd.t{outline:2px solid var(--m)}
.lgf input{margin:5px 0;text-align:center;font-size:17px}.lnk{background:none;border:0;color:var(--m);font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin:6px 8px}#logo{display:flex;flex:none}
#ft{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}#ft b{color:var(--text);font-weight:800}#ft .lg{display:flex;justify-content:center;margin-bottom:8px}#ft .lg img{display:block;border-radius:50%;box-shadow:0 3px 12px var(--sh)}
.cl{display:grid;gap:10px}.ct{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-left:6px solid var(--l);border-radius:16px;padding:12px 16px;font:inherit;font-weight:800;font-size:18px;color:var(--text);box-shadow:0 2px 8px var(--sh);cursor:pointer}.ct .e{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--l) 16%,transparent);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}.ct small{display:block;font-weight:600;color:var(--muted);font-size:13px}.ct:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="app">
<header><button class="chip" id="bk">👤</button><h1 id="ttl">Hola</h1><button class="chip" id="th">🌓</button><div class="chip">⭐ <span id="score">0</span></div><div id="logo"></div></header>
<main id="main"></main>
<footer id="ft"><div class="lg" id="fl"></div><div>© <span id="yr"></span> <b>Agustín O.S.</b></div><div>Todos los derechos reservados · Mi cuaderno, 2º de primaria</div></footer>
</div>
<nav id="dock"><button data-s="home"><span>🏠</span>Inicio</button><button data-s="prog"><span>📈</span>Progreso</button><button data-s="cal"><span>📅</span>Días</button><button data-s="meds"><span>🏅</span>Medallas</button><button data-s="par"><span>👨‍👩‍👧</span>Padres</button></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),main=$('#main');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const newD=()=>({score:0,hist:[],lv:{},err:{},fc:{},days:{},best:0,med:[],mute:0,gh:0});
let cloud=false,FB=null,fbU=null,svT=null,LEG=null,unsubs=[];
let R={cur:null,names:[],d:{},u:{}},D=newD(),cur=null,tm=null,lastStory=-1,scr='home',parOK=false,cur_srcs=null;
try{const s=localStorage.getItem('mc3');if(s)R=JSON.parse(s)}catch(e){}
R.u=R.u||{};R.names=R.names||[];R.d=R.d||{};R.cur=null;D=newD();R.theme=(()=>{try{return localStorage.getItem('mct')}catch(e){return null}})()||R.theme||'auto';
const save=()=>{try{if(R.cur)R.d[R.cur]=D;if(cloud){pushSoon();return}localStorage.setItem('mc3',JSON.stringify(R))}catch(e){}};
const T=()=>new Date().toLocaleDateString('sv');
const GOAL=100;
function streak(){let n=0;const d=Date.now();for(let i=0;i<400;i++){const k=new Date(d-i*864e5).toLocaleDateString('sv');if(D.days[k]!==undefined)n++;else if(i>0)break}return n}
function setScore(d){D.score=Math.max(0,D.score+d);if(d>0){D.days[T()]=(D.days[T()]||0)+d;D.tot=(D.tot||0)+d}if(cur)cur.pts+=d;$('#score').textContent=D.score;save()}
function toast(m,ok){const t=$('#toast');t.textContent=m;t.style.background=ok?'var(--ok)':'var(--bad)';t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),1300)}
let ac;function beep(ok){if(D.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(ok?660:200,t);if(ok)o.frequency.setValueAtTime(880,t+.12);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}

const W=[['bike','🚲'],['cat','🐱'],['dog','🐶'],['sun','☀️'],['book','📖'],['fish','🐟'],['apple','🍎'],['house','🏠'],['tree','🌳'],['car','🚗'],['milk','🥛'],['ball','⚽'],['bird','🐦'],['star','⭐'],['cake','🎂'],['moon','🌙'],['shoe','👟'],['egg','🥚'],['bed','🛏️'],['hat','🧢'],['pig','🐷'],['cow','🐮'],['duck','🦆'],['frog','🐸'],['bear','🐻'],['bus','🚌'],['boat','⛵'],['cup','☕'],['key','🔑'],['bag','🎒'],['pen','🖊️'],['hand','✋'],['flower','🌸'],['banana','🍌'],['pizza','🍕'],['rain','🌧️'],['snow','❄️'],['lion','🦁'],['horse','🐴'],['clock','⏰']].map(([w,e])=>({w,e}));
const C=[['red','#e53935'],['blue','#1e88e5'],['green','#43a047'],['yellow','#fdd835'],['orange','#fb8c00'],['purple','#8e24aa'],['pink','#ec6fa5'],['black','#212121'],['white','#ffffff'],['brown','#795548'],['gray','#9e9e9e'],['gold','#d4af37'],['silver','#c0c0c0'],['turquoise','#26c6da']].map(([w,c])=>({w,c}));
const S=[
{t:'Frozen: las hermanas de hielo',x:'Elsa y Anna eran dos hermanas que vivían en un castillo. Elsa tenía un poder mágico: podía crear hielo y nieve con sus manos. Un día, sin querer, hizo daño a Anna con su magia y, desde entonces, Elsa se encerró en su cuarto por miedo. Anna se sentía muy sola y echaba de menos jugar con ella. Cuando Elsa se convirtió en reina, perdió el control y todo el reino quedó cubierto de nieve. Asustada, se fue a vivir a una montaña. Anna salió a buscarla con un amigo llamado Kristoff y un muñeco de nieve que hablaba, Olaf. Al final, Anna entendió que el amor de una hermana es la fuerza más grande y Elsa aprendió a controlar su poder. El verano volvió al reino.',q:[['¿Qué poder mágico tenía Elsa?',['Crear hielo y nieve','Volar por el cielo','Hablar con los animales'],0],['¿Por qué se encerró Elsa en su cuarto?',['Porque estaba enferma','Por miedo a hacer daño','Porque quería dormir'],1],['¿Quién acompañó a Anna a buscar a Elsa?',['Un dragón','Un príncipe','Kristoff y Olaf'],2],['¿Qué volvió al reino al final?',['El verano','La noche','Una tormenta'],0]]},
{t:'La sirenita',x:'En el fondo del mar vivía una sirenita llamada Ariel. Le encantaba nadar entre los peces y coleccionar objetos que caían de los barcos. Soñaba con conocer el mundo de las personas que vivían en la tierra. Una noche vio un barco con un príncipe y, cuando llegó una tormenta, Ariel lo salvó y lo llevó hasta la playa. Después se hizo amiga del príncipe. Para poder caminar, Ariel hizo un trato con una bruja del mar, pero a cambio perdió su voz. La bruja quería quedarse con ella, pero el príncipe y los amigos de Ariel la ayudaron. Al final, Ariel pudo vivir feliz con su familia y con el príncipe.',q:[['¿Dónde vivía Ariel?',['En una montaña','En el fondo del mar','En un castillo'],1],['¿Qué le encantaba coleccionar?',['Conchas de colores','Libros viejos','Objetos de los barcos'],2],['¿A quién salvó Ariel de la tormenta?',['A un príncipe','A una bruja','A un pez'],0],['¿Qué perdió Ariel por el trato?',['Sus amigos','Su voz','Su cola de colores'],1]]},
{t:'La bella y la bestia',x:'Bella era una joven amable a la que le gustaba mucho leer. Vivía en un pueblo con su padre, que era inventor. Un día, su padre se perdió en el bosque y llegó a un castillo misterioso, donde una Bestia lo encerró. Bella fue a buscarlo y pidió quedarse en su lugar. Al principio le daba miedo, pero poco a poco descubrió que la Bestia tenía buen corazón. En el castillo, los objetos hablaban: la tetera Sra. Potts, el reloj Din Don y el candelabro Lumiere. La Bestia le regaló una gran biblioteca y juntos leían historias. Cuando Bella aprendió a querer a la Bestia tal como era, el hechizo se rompió y él volvió a ser un príncipe.',q:[['¿Qué le gustaba hacer a Bella?',['Cocinar','Leer','Bailar'],1],['¿A qué se dedicaba su padre?',['Era inventor','Era pastor','Era pescador'],0],['¿Qué le regaló la Bestia?',['Un caballo','Un vestido','Una gran biblioteca'],2],['¿Cómo se rompió el hechizo?',['Con una poción','Bella aprendió a quererlo tal como era','Con un beso al padre'],1]]},
{t:'La liebre y la tortuga',x:'Una liebre muy rápida se reía siempre de una tortuga porque caminaba muy despacio. Un día la tortuga se cansó de las burlas y le dijo: “Te reto a una carrera”. La liebre aceptó riendo. Todos los animales del bosque fueron a ver la carrera. Cuando empezó, la liebre salió corriendo y dejó a la tortuga muy lejos. Como se sentía tan segura, se paró a mitad de camino a echarse una siesta bajo un árbol. Mientras tanto, la tortuga siguió caminando sin parar, paso a paso. Cuando la liebre se despertó, vio con sorpresa que la tortuga estaba a punto de llegar a la meta. La tortuga ganó. Aprendimos que con constancia se consiguen las cosas.',q:[['¿De quién se reía la liebre?',['De un gato','De una tortuga','De un ratón'],1],['¿Qué hizo la liebre a mitad de camino?',['Se echó una siesta','Comió zanahorias','Se perdió'],0],['¿Quién ganó la carrera?',['La liebre','Nadie','La tortuga'],2],['¿Qué aprendemos del cuento?',['Que hay que correr siempre','Que con constancia se consiguen las cosas','Que dormir es malo'],1]]}
];
S.push(
{t:'Caperucita Roja',x:'Caperucita Roja era una niña que vivía cerca del bosque con su mamá. Se llamaba así por la capa roja con capucha que le había hecho su abuela. Un día, su mamá le preparó una cesta con pan y miel para llevársela a la abuela, que estaba enferma. Le dijo: «No te desvíes del camino y no hables con extraños». Caperucita entró en el bosque cantando. Allí se encontró con un lobo muy astuto que le preguntó adónde iba, y ella se lo contó sin pensar. El lobo corrió por un atajo y llegó antes a casa de la abuela. Cuando Caperucita llegó, notó que su abuela tenía unos ojos y unas orejas enormes. En ese momento apareció un leñador, que oyó los gritos y ahuyentó al lobo. Caperucita aprendió que siempre hay que hacer caso a mamá.',q:[['¿Por qué se llamaba Caperucita Roja?',['Por la capa roja que le hizo su abuela','Por su pelo rojo','Por su casa roja'],0],['¿Qué llevaba en la cesta?',['Fruta y leche','Pan y miel','Pasteles y zumo'],1],['¿Quién llegó antes a casa de la abuela?',['El lobo','El leñador','La mamá'],0],['¿Quién ahuyentó al lobo?',['La abuela','Caperucita','Un leñador'],2]]},
{t:'Los tres cerditos',x:'Había una vez tres cerditos hermanos que se hicieron mayores y decidieron construir cada uno su propia casa. El más pequeño, que era muy perezoso, hizo su casa de paja en un momento. El mediano la hizo de madera y también terminó pronto para irse a jugar. El mayor trabajó mucho y construyó una casa de ladrillos, fuerte y segura. Un día llegó un lobo hambriento. Sopló y sopló la casa de paja y esta se cayó. Los cerditos salieron corriendo a la casa de madera, pero el lobo también la derribó soplando. Entonces los tres se refugiaron en la casa de ladrillos. El lobo sopló con todas sus fuerzas, pero la casa no se movió. Los cerditos aprendieron que el esfuerzo siempre da buen resultado.',q:[['¿De qué era la casa del cerdito más pequeño?',['De ladrillos','De madera','De paja'],2],['¿Quién construyó la casa de ladrillos?',['El cerdito mayor','El cerdito pequeño','El lobo'],0],['¿Qué hizo el lobo para derribar las casas?',['Sopló','Las quemó','Las empujó con un palo'],0],['¿Qué aprendieron los cerditos?',['Que jugar es mejor que trabajar','Que el esfuerzo da buen resultado','Que los lobos son amigos'],1]]},
{t:'Pinocho',x:'Geppetto era un carpintero que vivía solo y soñaba con tener un hijo. Una noche talló un muñeco de madera y lo llamó Pinocho. Un hada buena le dio vida y le prometió que, si era valiente, sincero y obediente, un día se convertiría en un niño de verdad. Geppetto lo mandó a la escuela con un libro nuevo, pero por el camino Pinocho conoció a un zorro y a un gato que lo engañaron. Cada vez que Pinocho decía una mentira, su nariz crecía y crecía. Más tarde, supo que su padre estaba dentro de una enorme ballena y fue a salvarlo. Gracias a su valentía y a su bondad, el hada lo convirtió en un niño de verdad.',q:[['¿A qué se dedicaba Geppetto?',['Era pescador','Era carpintero','Era maestro'],1],['¿Qué le pasaba a Pinocho cuando mentía?',['Se le caía el pelo','Se ponía rojo','Le crecía la nariz'],2],['¿Dónde estaba atrapado Geppetto?',['Dentro de una ballena','En un castillo','En una cueva'],0],['¿Quién dio vida a Pinocho?',['Un mago','Un hada buena','Un zorro'],1]]},
{t:'Cenicienta',x:'Cenicienta vivía con su malvada madrastra y sus dos hermanastras, que la hacían trabajar todo el día limpiando la casa. Un día, el rey invitó a todas las jóvenes del reino a un baile en el palacio para que el príncipe conociera a una novia. La madrastra no dejó ir a Cenicienta. Entonces apareció su hada madrina, que con su varita convirtió una calabaza en una carroza y le regaló un vestido precioso y unos zapatos de cristal. Le avisó de que la magia terminaría a medianoche. En el baile, Cenicienta bailó con el príncipe, pero al sonar las doce huyó y perdió un zapato. El príncipe recorrió el reino probando el zapato a todas las jóvenes. Solo le quedó bien a Cenicienta, y los dos se casaron.',q:[['¿Con quién vivía Cenicienta?',['Con su abuela','Con su madrastra y sus hermanastras','Con el príncipe'],1],['¿En qué convirtió el hada la calabaza?',['En un caballo','En un vestido','En una carroza'],2],['¿A qué hora terminaba la magia?',['A medianoche','Al amanecer','A la hora de comer'],0],['¿Qué perdió Cenicienta al huir?',['Una corona','Un zapato','Un anillo'],1]]},
{t:'El patito feo',x:'En una granja, una mamá pata empollaba sus huevos. Cuando nacieron, todos los patitos eran amarillos, menos uno, que era grande y gris. Los demás animales se reían de él y le decían que era muy feo. El patito, muy triste, decidió marcharse de la granja. Pasó un invierno muy duro, solo y con mucho frío, escondido entre los juncos de un lago. Cuando llegó la primavera, vio unas aves blancas y elegantes que nadaban en el agua. Al acercarse, vio su reflejo y se dio cuenta de que ya no era un patito gris, sino un hermoso cisne. Los otros cisnes lo recibieron con alegría y, por fin, el patito se sintió feliz y querido.',q:[['¿De qué color era el patito diferente?',['Amarillo','Gris','Negro'],1],['¿Por qué se fue de la granja?',['Porque se reían de él','Porque tenía hambre','Porque quería viajar'],0],['¿Cuándo vio a los cisnes?',['En invierno','En verano','En primavera'],2],['¿En qué se había convertido el patito?',['En un cisne','En un pato blanco','En un ganso'],0]]},
{t:'Ricitos de Oro',x:'Ricitos de Oro era una niña curiosa que paseaba por el bosque y encontró una casita con la puerta abierta. Dentro vivía una familia de tres osos: papá oso, mamá osa y osito. Sobre la mesa había tres cuencos de sopa. Probó la del cuenco grande y estaba muy caliente; probó la del mediano y estaba muy fría; la del pequeño estaba perfecta y se la comió toda. Después se cansó y quiso sentarse. La silla grande era muy dura, la mediana muy blanda y la pequeña se rompió al sentarse. Subió a la habitación y se durmió en la cama pequeña. Cuando volvieron los osos y vieron lo que había pasado, Ricitos de Oro se despertó asustada, salió corriendo y nunca volvió.',q:[['¿Cuántos osos vivían en la casa?',['Dos','Tres','Cuatro'],1],['¿Cómo estaba la sopa del cuenco pequeño?',['Perfecta','Muy fría','Muy caliente'],0],['¿Qué le pasó a la silla pequeña?',['Era muy dura','Se rompió','Era muy blanda'],1],['¿Dónde se durmió Ricitos de Oro?',['En el sofá','En la cama grande','En la cama pequeña'],2]]}

 const stop=new Set(['porque','cuando','donde','entonces','también','pero','como','para','desde','hasta','sobre','entre','había','estaba','tenía','todos','todas','siempre','después','mientras','estaban','tenían','aunque','todo','cada','algo','nunca','todavía']);

  const sl=s.toLowerCase(),ws=shuffle((sl.match(rx)||[]).filter(w=>words.includes(w)));if(!ws.length)continue;

  const o=shuffle([w,...d]);qs.push(['Completa la frase: «'+esc(s.slice(0,m.index)+'_____'+s.slice(m.index+w.length))+'»',o,o.indexOf(w)])}
